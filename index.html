<html>
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- =========================
         FEEDBACK VISUAL
    ========================== -->

    <style>

      #mensaje {
        position: fixed;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-family: Arial;
        font-size: 22px;
        z-index: 9999;
        text-shadow: 2px 2px 5px black;
      }

    </style>

  </head>


  <body>


    <!-- =========================
         MENSAJE
    ========================== -->

    <div id="mensaje">
      🔍 Escanea un target
    </div>


    <a-scene

      mindar-image="imageTargetSrc: ./markerc.mind; maxTrack: 4"

      color-space="sRGB"

      renderer="colorManagement: true, physicallyCorrectLights"

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false">


      <!-- =========================
           MODELOS
      ========================== -->

      <a-assets>

        <a-asset-item
          id="GatoBananaModel"
          src="./GatoBanana.glb">
        </a-asset-item>

        <a-asset-item
          id="FoxModel"
          src="./Fox.glb">
        </a-asset-item>

        <a-asset-item
          id="SandiaModel"
          src="./Sandia.glb">
        </a-asset-item>

        <a-asset-item
          id="GhostModel"
          src="./Ghost.glb">
        </a-asset-item>

      </a-assets>


      <!-- =========================
           CÁMARA
      ========================== -->

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        cursor="rayOrigin: mouse; fuse: false"
        raycaster="objects: .clickable; far: 10000">
      </a-camera>


      <!-- ==================================================
           TARGET 3 - GATO
      ================================================== -->

      <a-entity
        id="targetGato"
        mindar-image-target="targetIndex: 3">


        <!-- GATO -->

        <a-gltf-model
          class="clickable gato-model"
          src="#GatoBananaModel"
          position="0 -1.5 0"
          scale="0.8 0.8 0.8"
          animation-mixer>
        </a-gltf-model>


        <!-- FOX -->

        <a-gltf-model
          class="fox-model"
          src="#FoxModel"
          position="0 0 0"
          scale="0.3 0.3 0.3"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- SANDÍA -->

        <a-gltf-model
          class="sandia-model"
          src="#SandiaModel"
          position="0 -0.4 0"
          scale="0.5 0.5 0.5"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- GHOST -->

        <a-gltf-model
          class="ghost-model"
          src="#GhostModel"
          position="0 0 0"
          scale="0.3 0.3 0.3"
          visible="false"
          animation-mixer>
        </a-gltf-model>


      </a-entity>


      <!-- ==================================================
           TARGET 1 - FOX
      ================================================== -->

      <a-entity
        id="targetFox"
        mindar-image-target="targetIndex: 1">


        <!-- GATO -->

        <a-gltf-model
          class="gato-model"
          src="#GatoBananaModel"
          position="0 -1.5 0"
          scale="0.8 0.8 0.8"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- FOX -->

        <a-gltf-model
          class="clickable fox-model"
          src="#FoxModel"
          position="0 0 0"
          scale="0.3 0.3 0.3"
          animation-mixer>
        </a-gltf-model>


        <!-- SANDÍA -->

        <a-gltf-model
          class="sandia-model"
          src="#SandiaModel"
          position="0 -0.4 0"
          scale="0.5 0.5 0.5"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- GHOST -->

        <a-gltf-model
          class="ghost-model"
          src="#GhostModel"
          position="0 0 0"
          scale="0.3 0.3 0.3"
          visible="false"
          animation-mixer>
        </a-gltf-model>


      </a-entity>


      <!-- ==================================================
           TARGET 2 - SANDÍA
      ================================================== -->

      <a-entity
        id="targetSandia"
        mindar-image-target="targetIndex: 2">


        <!-- GATO -->

        <a-gltf-model
          class="gato-model"
          src="#GatoBananaModel"
          position="0 -1.5 0"
          scale="0.8 0.8 0.8"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- FOX -->

        <a-gltf-model
          class="fox-model"
          src="#FoxModel"
          position="0 0 0"
          scale="0.3 0.3 0.3"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- SANDÍA -->

        <a-gltf-model
          class="clickable sandia-model"
          src="#SandiaModel"
          position="0 -0.4 0"
          scale="0.5 0.5 0.5"
          animation-mixer>
        </a-gltf-model>


        <!-- GHOST -->

        <a-gltf-model
          class="ghost-model"
          src="#GhostModel"
          position="0 0 0"
          scale="0.3 0.3 0.3"
          visible="false"
          animation-mixer>
        </a-gltf-model>


      </a-entity>


      <!-- ==================================================
           TARGET 0 - GHOST
      ================================================== -->

      <a-entity
        id="targetGhost"
        mindar-image-target="targetIndex: 0">


        <!-- GATO -->

        <a-gltf-model
          class="gato-model"
          src="#GatoBananaModel"
          position="0 -1.5 0"
          scale="0.8 0.8 0.8"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- FOX -->

        <a-gltf-model
          class="fox-model"
          src="#FoxModel"
          position="0 0 0"
          scale="0.3 0.3 0.3"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- SANDÍA -->

        <a-gltf-model
          class="sandia-model"
          src="#SandiaModel"
          position="0 -0.4 0"
          scale="0.5 0.5 0.5"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- GHOST -->

        <a-gltf-model
          class="clickable ghost-model"
          src="#GhostModel"
          position="0 0 0"
          scale="0.3 0.3 0.3"
          animation-mixer>
        </a-gltf-model>


      </a-entity>


    </a-scene>


    <!-- =========================
         INTERACCIÓN + FEEDBACK
    ========================== -->

    <script>

      document.addEventListener("DOMContentLoaded", () => {


        const mensaje =
          document.querySelector("#mensaje");


        /*
         * =========================
         * FEEDBACK DE LOS TARGETS
         * =========================
         */

        document
          .querySelectorAll("[mindar-image-target]")
          .forEach((target) => {


            target.addEventListener(
              "targetFound",
              () => {

                mensaje.innerHTML =
                  "✅ Target detectado<br>Toca el modelo para cambiarlo";

              }
            );


            target.addEventListener(
              "targetLost",
              () => {

                mensaje.innerHTML =
                  "🔍 Escanea un target";

              }
            );


          });


        /*
         * =========================
         * CAMBIO DE MODELO
         * =========================
         */

        function cambiarModelo(target, modeloActual, siguienteModelo) {


          // Ocultar modelo actual

          modeloActual.setAttribute(
            "visible",
            "false"
          );


          // Quitarle la clase clickable

          modeloActual.classList.remove(
            "clickable"
          );


          // Mostrar siguiente modelo

          siguienteModelo.setAttribute(
            "visible",
            "true"
          );


          // Hacer que el siguiente modelo
          // pueda recibir el toque

          siguienteModelo.classList.add(
            "clickable"
          );


        }


        /*
         * =========================
         * FUNCIÓN PARA CONFIGURAR
         * LOS MODELOS DE CADA TARGET
         * =========================
         */

        function configurarTarget(target) {


          const modelos =
            target.querySelectorAll("a-gltf-model");


          let indiceActual = 0;


          /*
           * Buscar cuál modelo empieza visible
           */

          modelos.forEach((modelo, indice) => {

            if (
              modelo.getAttribute("visible") !== false &&
              modelo.getAttribute("visible") !== "false"
            ) {

              indiceActual = indice;

            }

          });


          /*
           * Agregar interacción
           */

          modelos.forEach((modelo) => {


            modelo.addEventListener(
              "click",
              function() {


                console.log(
                  "MODELO TOCADO"
                );


                /*
                 * Buscar índice actual
                 */

                let actual = -1;

                modelos.forEach(
                  (m, i) => {

                    if (
                      m.classList.contains(
                        "clickable"
                      )
                    ) {

                      actual = i;

                    }

                  }
                );


                /*
                 * Siguiente modelo
                 */

                let siguiente =
                  (actual + 1) %
                  modelos.length;


                cambiarModelo(
                  target,
                  modelos[actual],
                  modelos[siguiente]
                );


              }
            );


          });


        }


        /*
         * =========================
         * CONFIGURAR LOS 4 TARGETS
         * =========================
         */

        configurarTarget(
          document.querySelector("#targetGato")
        );


        configurarTarget(
          document.querySelector("#targetFox")
        );


        configurarTarget(
          document.querySelector("#targetSandia")
        );


        configurarTarget(
          document.querySelector("#targetGhost")
        );


      });

    </script>


  </body>
</html>
