
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>

    <a-scene mindar-image="imageTargetSrc: ./markerc.mind; maxTrack: 4" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="GatoBananaModel" src="./GatoBanana.glb"></a-asset-item>
        <a-asset-item id="FoxModel" src="./Fox.glb"></a-asset-item>
        <a-asset-item id="SandiaModel" src="./Sandia.glb"></a-asset-item>
        <a-asset-item id="GhostModel" src="./Ghost.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

     <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model src="#GatoBananaModel" rotation="0 0 0 " position="0 -1 0" scale="0.5 0.5 0.5"  animation-mixer>
          </a-gltf-model>
          </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model src="#FoxModel" rotation="0 0 0 " position="0 0 0" scale="0.1 0.1 0.1" animation-mixer>
          </a-gltf-model>
          </a-entity>

   <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model src="#SandiaModel" rotation="0 0 0 " position="0 -0.5 0" scale="0.5 0.5 0.5" animation-mixer>
          </a-gltf-model>
          </a-entity>

   <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#GhostModel" rotation="0 0 0 " position="0 0 0" scale="0.1 0.1 0.1" animation-mixer>
          </a-gltf-model>
          </a-entity>
    </a-scene>
  </body>
</html>
