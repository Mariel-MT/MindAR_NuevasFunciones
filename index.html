<html>
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- FEEDBACK VISUAL -->

    <style>

      #mensaje {
        position: fixed;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-family: Arial;
        font-size: 22px;
        z-index: 9999;
        text-shadow: 2px 2px 5px black;
      }

    </style>

  </head>


  <body>

    <!-- MENSAJE -->

    <div id="mensaje">
      🔍 Escanea un target
    </div>


    <a-scene

      mindar-image="imageTargetSrc: ./markerc.mind; maxTrack: 4"

      color-space="sRGB"

      renderer="colorManagement: true, physicallyCorrectLights"

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false">


      <!-- MODELOS -->

      <a-assets>

        <a-asset-item
          id="GatoBananaModel"
          src="./GatoBanana.glb">
        </a-asset-item>

        <a-asset-item
          id="FoxModel"
          src="./Fox.glb">
        </a-asset-item>

        <a-asset-item
          id="SandiaModel"
          src="./Sandia.glb">
        </a-asset-item>

        <a-asset-item
          id="GhostModel"
          src="./Ghost.glb">
        </a-asset-item>

      </a-assets>


      <!-- CÁMARA -->

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        cursor="rayOrigin: mouse; fuse: false"
        raycaster="objects: .clickable; far: 10000">
      </a-camera>


      <!-- =========================
           TARGET 3 - GATO
      ========================== -->

      <a-entity
        mindar-image-target="targetIndex: 3">

        <a-gltf-model

          id="gato"

          class="clickable"

          src="#GatoBananaModel"

          rotation="0 0 0"

          position="0 -1.5 0"

          scale="0.8 0.8 0.8"

          animation-mixer>

        </a-gltf-model>

      </a-entity>


      <!-- =========================
           TARGET 1 - FOX
      ========================== -->

      <a-entity
        mindar-image-target="targetIndex: 1">

        <a-gltf-model

          id="fox"

          class="clickable"

          src="#FoxModel"

          rotation="0 0 0"

          position="0 0 0"

          scale="0.3 0.3 0.3"

          animation-mixer>

        </a-gltf-model>

      </a-entity>


      <!-- =========================
           TARGET 2 - SANDIA
      ========================== -->

      <a-entity
        mindar-image-target="targetIndex: 2">

        <a-gltf-model

          id="sandia"

          class="clickable"

          src="#SandiaModel"

          rotation="0 0 0"

          position="0 -0.4 0"

          scale="0.5 0.5 0.5"

          animation-mixer>

        </a-gltf-model>

      </a-entity>


      <!-- =========================
           TARGET 0 - GHOST
      ========================== -->

      <a-entity
        mindar-image-target="targetIndex: 0">

        <a-gltf-model

          id="ghost"

          class="clickable"

          src="#GhostModel"

          rotation="0 0 0"

          position="0 0 0"

          scale="0.3 0.3 0.3"

          animation-mixer>

        </a-gltf-model>

      </a-entity>


    </a-scene>


    <!-- =========================
         INTERACCIÓN + FEEDBACK
    ========================= -->

    <script>

      document.addEventListener("DOMContentLoaded", () => {


        const mensaje =
          document.querySelector("#mensaje");


        /*
         * =========================
         * FEEDBACK DE LOS TARGETS
         * =========================
         */

        document
          .querySelectorAll("[mindar-image-target]")
          .forEach((target) => {


            target.addEventListener(
              "targetFound",
              () => {

                mensaje.innerHTML =
                  "✅ Target detectado<br>Toca el modelo para cambiarlo";

              }
            );


            target.addEventListener(
              "targetLost",
              () => {

                mensaje.innerHTML =
                  "🔍 Escanea un target";

              }
            );

          });


        /*
         * =========================
         * GATO → FOX
         * =========================
         */

        document.querySelector("#gato").addEventListener("click", function() {

          console.log("TOQUE EN GATO");

          this.setAttribute("src", "#FoxModel");
          this.setAttribute("position", "0 0 0");
          this.setAttribute("scale", "0.3 0.3 0.3");

        });


        /*
         * =========================
         * FOX → SANDIA
         * =========================
         */

        document.querySelector("#fox").addEventListener("click", function() {

          console.log("TOQUE EN FOX");

          this.setAttribute("src", "#SandiaModel");
          this.setAttribute("position", "0 -0.4 0");
          this.setAttribute("scale", "0.5 0.5 0.5");

        });


        /*
         * =========================
         * SANDIA → GHOST
         * =========================
         */

        document.querySelector("#sandia").addEventListener("click", function() {

          console.log("TOQUE EN SANDIA");

          this.setAttribute("src", "#GhostModel");
          this.setAttribute("position", "0 0 0");
          this.setAttribute("scale", "0.3 0.3 0.3");

        });


        /*
         * =========================
         * GHOST → GATO
         * =========================
         */

        document.querySelector("#ghost").addEventListener("click", function() {

          console.log("TOQUE EN GHOST");

          this.setAttribute("src", "#GatoBananaModel");
          this.setAttribute("position", "0 -1.5 0");
          this.setAttribute("scale", "0.8 0.8 0.8");

        });


      });

    </script>


  </body>
</html>
