<script>
document.addEventListener("DOMContentLoaded", () => {

  const mensaje = document.querySelector("#mensaje");

  // =================================
  // CONFIGURACIÓN DE LOS MODELOS
  // =================================

  const modelos = [
    {
      src: "#GatoBananaModel",
      posicion: "0 -1.5 0",
      escala: "0.8 0.8 0.8"
    },
    {
      src: "#FoxModel",
      posicion: "0 0 0",
      escala: "0.3 0.3 0.3"
    },
    {
      src: "#SandiaModel",
      posicion: "0 -0.4 0",
      escala: "0.5 0.5 0.5"
    },
    {
      src: "#GhostModel",
      posicion: "0 0 0",
      escala: "0.3 0.3 0.3"
    }
  ];

  // =================================
  // FEEDBACK VISUAL DE LOS TARGETS
  // =================================

  document.querySelectorAll("[mindar-image-target]").forEach(target => {

    target.addEventListener("targetFound", () => {
      mensaje.innerHTML =
        "✅ Target detectado<br>Toca el modelo para cambiarlo";
    });

    target.addEventListener("targetLost", () => {
      mensaje.innerHTML = "🔍 Escanea un target";
    });

  });

  // =================================
  // FUNCIÓN PARA CAMBIAR DE MODELO
  // =================================

  function activarInteraccion(id, indiceInicial) {

    const entidad = document.querySelector(id);

    if (!entidad) {
      console.error("No se encontró la entidad:", id);
      return;
    }

    let indiceActual = indiceInicial;
    let cargando = false;

    entidad.addEventListener("click", () => {

      // Evitar varios toques mientras carga
      if (cargando) return;

      cargando = true;

      const siguienteIndice =
        (indiceActual + 1) % modelos.length;

      const siguienteModelo = modelos[siguienteIndice];

      console.log("Cambiando a:", siguienteModelo.src);

      // Esperar a que el nuevo modelo cargue
      const alCargar = () => {

        entidad.removeEventListener("model-loaded", alCargar);

        // Actualizar posición y escala
        entidad.setAttribute(
          "position",
          siguienteModelo.posicion
        );

        entidad.setAttribute(
          "scale",
          siguienteModelo.escala
        );

        // Actualizar el índice
        indiceActual = siguienteIndice;

        cargando = false;

        console.log("Modelo cambiado correctamente");
      };

      // Detectar errores de carga
      const alError = (evento) => {

        entidad.removeEventListener("model-error", alError);
        entidad.removeEventListener("model-loaded", alCargar);

        cargando = false;

        console.error("Error al cargar el modelo:", evento);

      };

      entidad.addEventListener("model-loaded", alCargar, {
        once: true
      });

      entidad.addEventListener("model-error", alError, {
        once: true
      });

      // Cambiar el modelo
      entidad.setAttribute("src", siguienteModelo.src);

      // Reiniciar animación
      entidad.removeAttribute("animation-mixer");

      entidad.setAttribute("animation-mixer", "");

    });

  }

  // =================================
  // ACTIVAR INTERACCIÓN EN CADA MODELO
  // =================================

  activarInteraccion("#gato", 0);

  activarInteraccion("#fox", 1);

  activarInteraccion("#sandia", 2);

  activarInteraccion("#ghost", 3);

});
</script>
